                      zettle_payout_matched: {type: integer, description: Zettle card payouts matched}
                      transfer_matched: {type: integer, description: Internal transfers matched}
                      card_tagged: {type: integer, description: Corporate card transactions identified}
                      card_matched: {type: integer, description: Card transactions matched to receipts}
                      card_missing: {type: integer, description: Card transactions missing receipt}
