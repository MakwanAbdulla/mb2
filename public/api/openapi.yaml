      operationId: accountingReportsVendorReport
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: fiscal_year_id
        required: true
        schema: {type: integer}
      - in: query
        name: date_from
        schema: {type: string, format: date}
        description: Defaults to the fiscal year's start date
      - in: query
        name: date_to
        schema: {type: string, format: date}
        description: Defaults to the fiscal year's end date
      - in: query
        name: format
        schema: {type: string, enum: [json, pdf]}
      responses:
        '200':
          description: Vendor report data or PDF file
  /admin/audit-log:
    get:
      tags: [AuditLog]
      summary: List audit log entries (paginated, 50/page)
      operationId: adminAuditLogIndex
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: area
        schema: {type: string}
        description: Filter by area (e.g. members, payments, system)
      - in: query
        name: user_id
        schema: {type: integer}
        description: Filter by user
      - in: query
        name: action
        schema: {type: string}
        description: Filter by action key (e.g. member_created)
      - in: query
        name: from
        schema: {type: string, format: date-time}
        description: Earliest created_at (inclusive)
      - in: query
        name: to
        schema: {type: string, format: date-time}
        description: Latest created_at (inclusive)
      responses:
        '200':
          description: Paginated audit log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        user:
                          nullable: true
                          type: object
                          properties:
                            id: {type: integer}
                            name: {type: string}
                        action: {type: string}
                        area: {type: string}
                        subject: {type: string}
                        auditable_type: {type: string, nullable: true}
                        auditable_id: {type: integer, nullable: true}
                        changes: {type: object, nullable: true}
                        ip_address: {type: string, nullable: true}
                        created_at: {type: string, format: date-time}
                  meta:
                    type: object
                    properties:
                      current_page: {type: integer}
                      last_page: {type: integer}
                      per_page: {type: integer}
                      total: {type: integer}
  /admin/inbox-mailboxes:
    get:
      tags: [InboxMailboxes]
      summary: List inbox mailboxes (passwords omitted)
      operationId: adminInboxMailboxesIndex
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Inbox mailboxes without credentials
    post:
      tags: [InboxMailboxes]
      summary: Create inbox mailbox
      operationId: adminInboxMailboxesStore
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, driver]
              properties:
                name: {type: string}
                purpose: {type: string, nullable: true, enum: [office, accounting]}
                owner_type: {type: string, nullable: true}
                owner_id: {type: integer, nullable: true}
                driver: {type: string, enum: [google_workspace, imap]}
                mailbox: {type: string, nullable: true}
                imap_host: {type: string, nullable: true}
                imap_port: {type: integer, nullable: true}
                imap_encryption: {type: string, nullable: true, enum: [ssl, tls, none]}
                imap_username: {type: string, nullable: true}
                imap_password: {type: string, nullable: true}
                imap_folder: {type: string, nullable: true}
                smtp_host: {type: string, nullable: true}
                smtp_port: {type: integer, nullable: true}
                smtp_username: {type: string, nullable: true}
                smtp_password: {type: string, nullable: true}
                is_enabled: {type: boolean}
      responses:
        '201':
          description: Created
  /admin/inbox-mailboxes/{mailbox}:
    get:
      tags: [InboxMailboxes]
      summary: Get inbox mailbox (passwords omitted)
      operationId: adminInboxMailboxesShow
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: mailbox
        required: true
        schema: {type: integer}
      responses:
        '200':
          description: Mailbox detail
    patch:
      tags: [InboxMailboxes]
      summary: Update inbox mailbox (password fields only updated when explicitly sent)
      operationId: adminInboxMailboxesUpdate
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: mailbox
        required: true
        schema: {type: integer}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                purpose: {type: string, nullable: true}
                owner_type: {type: string, nullable: true}
                owner_id: {type: integer, nullable: true}
                driver: {type: string, enum: [google_workspace, imap]}
                mailbox: {type: string, nullable: true}
                imap_host: {type: string, nullable: true}
                imap_port: {type: integer, nullable: true}
                imap_encryption: {type: string, nullable: true, enum: [ssl, tls, none]}
                imap_username: {type: string, nullable: true}
                imap_password: {type: string, description: "Only sent when changing the password"}
                imap_folder: {type: string, nullable: true}
                smtp_host: {type: string, nullable: true}
                smtp_port: {type: integer, nullable: true}
                smtp_username: {type: string, nullable: true}
                smtp_password: {type: string, description: "Only sent when changing the password"}
                is_enabled: {type: boolean}
      responses:
        '200':
          description: Updated
    delete:
      tags: [InboxMailboxes]
      summary: Delete inbox mailbox
      operationId: adminInboxMailboxesDestroy
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: mailbox
        required: true
        schema: {type: integer}
      responses:
        '204':
          description: Deleted
  /admin/booking-statistics:
    get:
      tags: [BookingAdmin]
      summary: Booking statistics for a given year
      operationId: adminBookingStatisticsIndex
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: year
        schema: {type: integer}
        description: Year to compute statistics for (default current year)
      responses:
        '200':
          description: Booking statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      year: {type: integer}
                      prev_year: {type: integer}
                      kpis:
                        type: object
                        properties:
                          total_bookings: {type: integer}
                          total_bookings_prev: {type: integer}
                          unique_members: {type: integer}
                          unique_members_prev: {type: integer}
                          open_bookings: {type: integer}
                          top_activity: {type: string, nullable: true}
                      by_month:
                        type: array
                        items:
                          type: object
                          properties:
                            month: {type: integer}
                            label: {type: string}
                            current: {type: integer}
                            prev: {type: integer}
                      by_resource:
                        type: array
                        items:
                          type: object
                          properties:
                            resource_id: {type: integer}
                            name: {type: string}
                            count: {type: integer}
                            hours: {type: number}
                            avg_min: {type: integer}
                            open_pct: {type: integer}
                      by_activity:
                        type: array
                        items:
                          type: object
                          properties:
                            activity: {type: string}
                            current: {type: integer}
                            prev: {type: integer}
                      by_weekday:
                        type: array
                        items:
                          type: object
                          properties:
                            iso_weekday: {type: integer}
                            label: {type: string}
                            count: {type: integer}
                      top_users:
                        type: array
                        items:
                          type: object
                          properties:
                            user_id: {type: integer}
                            user_name: {type: string}
                            count: {type: integer}
                            last_at: {type: string, format: date-time}
        '403':
          description: Requires bookings.statistics
  /accounting/revision:
    get:
      tags: [AccountingRevision]
      summary: List journal entries for revision with review status and stats
      operationId: accountingRevisionIndex
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: fiscal_year_id
        required: true
        schema: {type: integer}
        description: ID of the fiscal year (required)
      - in: query
        name: series
        schema: {type: string}
        description: Filter by voucher series (e.g. A, B)
      - in: query
        name: review
        schema: {type: string, enum: [all, unreviewed, reviewed, commented]}
        description: Filter by review status (default all)
      - in: query
        name: date_from
        schema: {type: string, format: date}
        description: Start date filter (inclusive)
      - in: query
        name: date_to
        schema: {type: string, format: date}
        description: End date filter (inclusive)
      - in: query
        name: per_page
        schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Paginated journal entries with review fields and aggregated stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        fiscal_year_id: {type: integer}
                        series: {type: string}
                        number: {type: integer}
                        date: {type: string, format: date}
                        description: {type: string}
                        is_locked: {type: boolean}
                        source_type: {type: string, nullable: true}
                        source_id: {type: integer, nullable: true}
                        total_debit: {type: integer, description: Sum of debit lines in öre}
                        document_count: {type: integer}
                        is_reviewed: {type: boolean}
                        review_status: {type: string, enum: [reviewed, unreviewed]}
                        review_note: {type: string, nullable: true}
                        reviewed_by:
                          nullable: true
                          type: object
                          properties:
                            id: {type: integer}
                            name: {type: string}
                        reviewed_at: {type: string, format: date-time, nullable: true}
                        has_been_edited: {type: boolean}
                        created_by:
                          nullable: true
                          type: object
                          properties:
                            id: {type: integer}
                            name: {type: string}
                        created_at: {type: string, format: date-time}
                  stats:
                    type: object
                    properties:
                      total: {type: integer}
                      reviewed: {type: integer}
                      commented: {type: integer}
                  meta:
                    type: object
                    properties:
                      current_page: {type: integer}
                      last_page: {type: integer}
                      per_page: {type: integer}
                      total: {type: integer}
        '403':
          description: Requires role revisor or admin
  /accounting/revision/bulk-approve:
    post:
      tags: [AccountingRevision]
      summary: Bulk approve unreviewed journal entries
      operationId: accountingRevisionBulkApprove
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entry_ids]
              properties:
                entry_ids:
                  type: array
                  items: {type: integer}
                  description: IDs of journal entries to approve (already-reviewed entries are skipped)
      responses:
        '200':
          description: Number of entries that were newly approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      approved: {type: integer}
        '403':
          description: Requires role revisor or admin
  /accounting/revision/{journalEntry}/review:
    post:
      tags: [AccountingRevision]
      summary: Mark a journal entry as reviewed (approve)
      operationId: accountingRevisionReview
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: journalEntry
        required: true
        schema: {type: integer}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  nullable: true
                  maxLength: 1000
                  description: Optional review note
      responses:
        '200':
          description: Entry marked as reviewed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data:
                    type: object
                    properties:
                      is_reviewed: {type: boolean}
                      reviewed_by:
                        type: object
                        properties:
                          id: {type: integer}
                          name: {type: string}
                      reviewed_at: {type: string, format: date-time}
                      review_note: {type: string, nullable: true}
        '403':
          description: Requires role revisor or admin
    delete:
      tags: [AccountingRevision]
      summary: Remove review mark from a journal entry (unapprove)
      operationId: accountingRevisionUnapprove
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: journalEntry
        required: true
        schema: {type: integer}
      responses:
        '200':
          description: Review removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data:
                    type: object
                    properties:
                      is_reviewed: {type: boolean}
        '403':
          description: Requires role revisor or admin
  /gamification/leaderboard:
    get:
      tags: [Gamification]
      summary: Monthly XP leaderboard (top 20)
      operationId: gamificationLeaderboard
      security:
      - bearerAuth: []
      parameters:
      - {in: query, name: year, schema: {type: integer, minimum: 2020, maximum: 2100}, description: Defaults to the current year}
      - {in: query, name: month, schema: {type: integer, minimum: 1, maximum: 12}, description: Defaults to the current month}
      responses:
        '200':
          description: Leaderboard for the month
          content:
            application/json:
              schema:
                type: object
                properties:
                  year: {type: integer}
                  month: {type: integer}
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        rank: {type: integer}
                        member_id: {type: integer}
                        name: {type: string}
                        monthly_xp: {type: integer}
                        level: {type: integer}
                        level_name: {type: string}
  /gamification/me:
    get:
      tags: [Gamification]
      summary: Own XP, level, badges and remaining kudos this month
      operationId: gamificationMe
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Own gamification status
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_xp: {type: integer}
                  monthly_xp: {type: integer}
                  level:
                    type: object
                    description: Current level (level number, name and XP thresholds)
                  badges:
                    type: array
                    items:
                      type: object
                      properties:
                        key: {type: string}
                        label: {type: string}
                        awarded_at: {type: string, format: date-time}
                  kudos_remaining: {type: integer}
        '404':
          description: The user has no member profile
  /gamification/kudos/{member}:
    post:
      tags: [Gamification]
      summary: Give kudos to another member
      operationId: gamificationGiveKudos
      description: Awards XP to the receiving member. Limited per giver and month; giving kudos to yourself is refused.
      security:
      - bearerAuth: []
      parameters:
      - {in: path, name: member, required: true, schema: {type: integer}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: {type: string, maxLength: 100, nullable: true}
      responses:
        '200':
          description: Kudos given
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  xp_awarded: {type: integer}
                  kudos_remaining: {type: integer}
        '403':
          description: The caller has no member profile
        '422':
          description: Monthly kudos limit reached, or kudos to yourself
  /tournaments:
    get:
      tags: [Tournaments]
      summary: List public tournaments
      description: Public tournaments that are not draft or cancelled, newest first.
      operationId: tournamentsList
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Tournaments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        title: {type: string}
                        description: {type: string, nullable: true}
                        status: {type: string}
                        status_label: {type: string}
                        participant_type: {type: string}
                        participant_count: {type: integer}
                        is_public: {type: boolean}
                        created_at: {type: string, format: date-time}
  /tournaments/{tournament}:
    get:
      tags: [Tournaments]
      summary: Tournament with phases and standings
      operationId: tournamentsShow
      security:
      - bearerAuth: []
      parameters:
      - {in: path, name: tournament, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Tournament
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer}
                  title: {type: string}
                  description: {type: string, nullable: true}
                  status: {type: string}
                  phases:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        name: {type: string}
                        format: {type: string}
                        format_label: {type: string}
                        status: {type: string}
                        standings:
                          type: array
                          items:
                            type: object
                            properties:
                              rank: {type: integer, nullable: true}
                              participant: {type: string, nullable: true}
                              match_points: {type: integer}
                              game_points: {type: integer}
                              wins: {type: integer}
                              losses: {type: integer}
                              draws: {type: integer}
        '404':
          description: Not found or not public
  /scanner-relay/{session}/scan:
    post:
      tags: [ScannerRelay]
      summary: Push a scanned code to a paired kiosk session
      description: |
        A paired device (phone, handheld scanner) sends raw scanned codes; the browser kiosk
        polls them and performs the check-in. The session id comes from the pairing QR code
        shown at /admin/scanna. Requires `events.manage`.
      operationId: scannerRelayScan
      security:
      - bearerAuth: []
      parameters:
      - {in: path, name: session, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, maxLength: 512}
      responses:
        '200':
          description: Code queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  browser_connected: {type: boolean}
        '403':
          description: Requires events.manage
        '404':
          description: Unknown or expired pairing session
  /scanner-relay/{session}/heartbeat:
    post:
      tags: [ScannerRelay]
      summary: Keep a paired device marked as connected
      operationId: scannerRelayHeartbeat
      security:
      - bearerAuth: []
      parameters:
      - {in: path, name: session, required: true, schema: {type: string}}
      responses:
        '200':
          description: Session alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  browser_connected: {type: boolean}
        '403':
          description: Requires events.manage
        '404':
          description: Unknown or expired pairing session
