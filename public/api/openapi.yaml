openapi: 3.1.0
info:
  title: Membrum API
  description: 'REST API for the Membrum membership management system (Armagedon / Borås Spelförening).


    ## Authentication

    Most endpoints require a Bearer token obtained via `POST /api/v1/auth/tokens`.

    Same-domain SPA clients can use cookie-based auth (Laravel Sanctum stateful).

    Integrations use API clients (created by an admin at /admin/api-klienter) and exchange
    `client_id` + `client_secret` for a token via `POST /api/v1/auth/client-tokens`.


    ## Permissions and scopes

    Every endpoint checks the calling user''s permissions (Spatie). An API client acts as its
    service account, so the service account must be given the permissions the integration needs.

    An API client may also have **scopes** (a list of permission names). A scoped token can only
    use permissions that are **both** in its scopes **and** held by the service account — scopes
    narrow access, they never grant it. A client without scopes gets all of its service account''s
    permissions. `api.access` is always allowed.


    ## Rate limits

    - Authenticated requests: 120 per minute per user/service account.

    - Unauthenticated requests: 60 per minute per IP.

    - `POST /auth/tokens` and `POST /auth/client-tokens`: 10 per minute per IP.

    Exceeding a limit returns `429 Too Many Requests` with a `Retry-After` header (seconds).


    ## Conventions

    - All monetary amounts are integers in **öre** (SEK cents). `500` = 5,00 kr.

    - Dates are ISO 8601: `YYYY-MM-DD`.  Timestamps are ISO 8601 with timezone.

    - Pagination uses `?page=` and `?per_page=` (default 25, max 100).

    - Errors follow standard Laravel JSON format: `{"message": "...", "errors": {...}}`.

    '
