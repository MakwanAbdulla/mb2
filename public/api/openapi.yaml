- name: MemberCard
  description: Member card QR verification (public, HMAC-secured)
- name: Orders
  description: Own orders and invoices
- name: Family
  description: Own family group
- name: AccountDeletion
  description: GDPR account deletion requests
- name: Pages
  description: Public CMS pages
- name: Wiki
  description: Wiki spaces — public, a Bearer token unlocks what that user may read
- name: Navigation
  description: Public navigation items
- name: Events
  description: Public event listings and detail
