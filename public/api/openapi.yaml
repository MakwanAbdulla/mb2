  /accounting/receipt-scan:
    post:
      tags:
      - Accounting
      summary: Scan a receipt with AI
      operationId: accountingReceiptScan
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Receipt image (JPEG, PNG, GIF, WEBP) or PDF, max 20 MB
      responses:
        '200':
          description: AI scan result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      date:
                        type: string
                        format: date
                        nullable: true
                      vendor:
                        type: string
                        nullable: true
                      amount_ore:
                        type: integer
                        nullable: true
                        description: Total amount including VAT in öre
                      description:
                        type: string
                        nullable: true
                      suggested_account_code:
                        type: string
                        nullable: true
                      suggested_account_name:
                        type: string
                        nullable: true
                      suggested_account_id:
                        type: integer
                        nullable: true
                      confidence:
                        type: string
                        enum: [high, medium, low]
                        nullable: true
                      raw_text:
                        type: string
                        nullable: true
                        description: Extracted text (PDF only)
        '422':
          description: File validation failed or AI scan error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '403':
          description: Requires accounting.manage
      description: Upload a receipt image or PDF and get AI-extracted data (date, vendor, amount, suggested BAS account).
  /accounting/invoices/import-zip:
    post:
      tags:
      - Accounting
      summary: Bulk-create draft payable invoices from a ZIP of invoice files
      operationId: accountingInvoicesImportZip
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: ZIP of invoice files (PDF/JPEG/PNG/GIF/WEBP), max 45 MB total, max 60 files, max 20 MB per file
      responses:
        '200':
          description: Import result. Rows are only created when the extracted organisationsnummer matched an existing vendor and that vendor has a default account; everything else is reported in skipped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      created:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: integer}
                            vendor_id: {type: integer}
                            total: {type: integer, description: Total in öre}
                            file: {type: string}
                      skipped:
                        type: array
                        items:
                          type: object
                          properties:
                            original_name: {type: string}
                            reason: {type: string}
        '403':
          description: Requires accounting.manage
        '422':
          description: File validation failed (not a zip, or over 45 MB)
