                          id:
                            type: integer
                          already_present:
                            type: boolean
                          present:
                            type: boolean
                          voting_rights:
                            type: boolean
                          membership_valid:
                            type: boolean
                          role:
                            type: string
                      member:
                        type: object
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                          avatar_url:
                            type: string
                            nullable: true
                          is_active:
