  /verify-member-qr:
    post:
      tags:
      - MemberCard
      summary: Verify a member QR code (kiosk endpoint)
      description: >
        Public endpoint — no authentication required. The HMAC token embedded in
        the QR code provides the security. Used by the kiosk (Pi) to verify a
        scanned member card. The token is valid for ±2 seconds.
      operationId: verifyMemberQr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - member_id
                - token
              properties:
                member_id:
                  type: integer
                  description: The member's database ID
                  example: 42
                token:
                  type: string
                  description: 64-char hex HMAC token from the QR code URL
                  minLength: 64
                  maxLength: 64
      responses:
        '200':
          description: Valid QR code — member data returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  member_number:
                    type: string
                    nullable: true
                  avatar_url:
                    type: string
                    nullable: true
                  current_period:
                    type: object
                    nullable: true
                    properties:
                      year:
                        type: integer
                      membership_type:
                        type: string
                        enum: [single, family, youth, child, student, senior, honorary]
                      status:
                        type: string
                  sections:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                  is_active:
                    type: boolean
        '401':
          description: Invalid or expired QR code
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Ogiltig eller utgången QR-kod
        '422':
          description: Validation error (missing/invalid fields)
