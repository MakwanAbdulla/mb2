- name: Forms
  description: Admin — form builder (standalone forms and survey forms)
- name: Notices
  description: System notices and banners (public + admin)
- name: Tasks
  description: Meeting tasks assigned to members
- name: RecurringBookings
  description: Recurring booking series management
- name: VenueApplications
  description: Venue application requests for external events
- name: BookingCategories
  description: Booking resource categories
- name: BookingAdmin
