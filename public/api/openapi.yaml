components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Member:
      type: object
      properties:
        id:
          type: integer
          example: 42
        first_name:
          type: string
          example: Anna
        last_name:
          type: string
          example: Andersson
        full_name:
          type: string
          example: Anna Andersson
        email:
          type: string
          format: email
          example: anna@exempel.se
        phone:
          type: string
          nullable: true
          example: 070-123 45 67
        address:
          type: string
          nullable: true
          example: Storgatan 1
        postal_code:
          type: string
          nullable: true
          example: 503 38
        city:
          type: string
          nullable: true
          example: Borås
        date_of_birth:
          type: string
          format: date
          nullable: true
          example: '1990-06-15'
        membership_type:
          type: string
          enum:
          - single
          - family
          - youth
          - student
          - senior
          - honorary
          example: single
        status:
          type: string
          enum:
          - pending
          - active
          - inactive
          - expired
          - deceased
          example: active
        cogworks_id:
          type: string
          nullable: true
        has_account:
          type: boolean
          description: Whether a user account is linked
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        membership_periods:
          type: array
          items:
            $ref: '#/components/schemas/MembershipPeriod'
        sections:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              slug:
                type: string
        section_roles:
          type: array
          items:
            type: object
            properties:
              section_id:
                type: integer
              title:
                type: string
              valid_from:
                type: string
                format: date
                nullable: true
              valid_until:
                type: string
                format: date
                nullable: true
    MembershipPeriod:
      type: object
      properties:
        id:
          type: integer
        year:
          type: integer
          example: 2026
        membership_type:
          type: string
          enum:
          - single
          - family
          - youth
          - student
          - senior
          - honorary
        status:
          type: string
          enum:
          - pending_payment
          - active
          - expired
          - cancelled
        activated_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
    WikiPage:
      type: object
      properties:
        id:
          type: integer
        parent_id:
          type: integer
          nullable: true
        title:
          type: string
        slug:
          type: string
        sort_order:
          type: integer
        content:
          type: string
          nullable: true
          description: Sanitized HTML (Trix). Left out of the page list.
        updated_by:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
        url:
          type: string
          example: /wiki/styrelsen/kassorens-ar
        updated_at:
          type: string
          format: date-time
    WikiPageInput:
      type: object
      required:
      - title
      properties:
        title:
          type: string
          maxLength: 255
        content:
          type: string
          nullable: true
          description: HTML. Scripts, event handlers, inline styles and unsafe links are removed.
        parent_id:
          type: integer
          nullable: true
          description: A page in the same space; not the page itself or one of its subpages
        summary:
          type: string
          nullable: true
          maxLength: 255
          description: Describes the change; shown in the page history
    WikiPageRevision:
      type: object
      description: One saved version of a page. Written on every save that creates the page or changes its title or content.
      properties:
        id:
          type: integer
        title:
          type: string
        summary:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
          description: Sanitized HTML. Left out of the history list.
        user:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
        created_at:
          type: string
          format: date-time
    WikiSpace:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        read_access:
          type: string
          enum: [public, members, officials, group]
        group:
          type: object
          nullable: true
          description: The owning group, null for an association-wide space
          properties:
            id:
              type: integer
            name:
              type: string
        archived_at:
          type: string
          format: date-time
          nullable: true
        pages_count:
          type: integer
        url:
          type: string
          example: /wiki/styrelsen
        updated_at:
          type: string
          format: date-time
    Page:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
          example: Om oss
        subtitle:
          type: string
          nullable: true
        slug:
          type: string
          example: om-oss
        path_prefix:
          type: string
          nullable: true
          example: foreningen
        url:
          type: string
          example: /foreningen/om-oss
        content:
          type: string
          description: HTML content (from Trix editor)
        is_published:
          type: boolean
        show_in_nav:
          type: boolean
        nav_title:
          type: string
          nullable: true
        sort_order:
          type: integer
        updated_at:
          type: string
          format: date-time
    NavigationItem:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
          example: Om oss
        location:
          type: string
          enum:
          - topnav
          - footer
        url:
          type: string
          nullable: true
          example: /om-oss
        route_name:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
          description: Bootstrap icon name
        order:
          type: integer
        requires_auth:
          type: boolean
        permission:
          type: string
          nullable: true
        children:
          type: array
          items:
            $ref: '#/components/schemas/NavigationItem'
    TokenResponse:
      type: object
      properties:
        token:
          type: string
          example: 1|abc123...
        token_type:
          type: string
          example: Bearer
    UserMe:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        theme:
          type: string
          nullable: true
          enum:
          - light
          - dark
          - system
        member:
          nullable: true
          type: object
          properties:
            id:
              type: integer
            full_name:
              type: string
            membership_type:
              type: string
            status:
              type: string
    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        from:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        to:
          type: integer
        total:
          type: integer
    Order:
      type: object
      properties:
        id:
          type: integer
          example: 1
        payment_reference:
          type: string
          example: ARM-00001
        ocr_number:
          type: string
          example: '202600001211'
        status:
          type: string
          enum:
          - pending
          - paid
          - refunded
          - cancelled
          example: paid
        payment_method:
          type: string
          nullable: true
          enum:
          - stripe
          - swish_handel
          - swish
          - bankgiro
          - manual
          - free
          example: bankgiro
        total_ore:
          type: integer
          description: Total amount in öre (SEK cents)
          example: 25000
        total_formatted:
          type: string
          description: Human-readable total (Swedish locale)
          example: 250,00 kr
        paid_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-03-01T12:00:00+01:00'
        created_at:
          type: string
          format: date-time
          example: '2026-01-15T08:00:00+01:00'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
    OrderLine:
      type: object
      properties:
        id:
          type: integer
        category:
          type: string
          enum:
          - membership
          - event
          - shop
          example: membership
        description:
          type: string
          example: Enkelmedlemskap 2026
        quantity:
          type: integer
          example: 1
        unit_price_ore:
          type: integer
          example: 25000
        discount_ore:
          type: integer
          example: 0
        line_total_ore:
          type: integer
          example: 25000
    FamilyMember:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
          example: Anna Andersson
        role:
          type: string
          enum:
          - adult
          - child
        has_own_account:
          type: boolean
        is_billing_contact:
          type: boolean
    FamilyGroup:
      type: object
      properties:
        id:
          type: integer
        administrator:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            full_name:
              type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/FamilyMember'
    EventOccurrence:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
          nullable: true
          example: Dag 1
        starts_at:
          type: string
          format: date-time
          example: '2026-04-12T14:00:00+02:00'
        ends_at:
          type: string
          format: date-time
          example: '2026-04-12T22:00:00+02:00'
        capacity:
          type: integer
          nullable: true
          description: Max participants (alias for max_participants)
        is_dropin:
          type: boolean
        location_override:
          type: string
          nullable: true
    EventPriceTier:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
          example: Vuxen
        description:
          type: string
          nullable: true
        price_ore:
          type: integer
          description: Price in öre (SEK cents)
          example: 15000
        price_formatted:
          type: string
          example: 150,00 kr
        requires_membership:
          type: boolean
        max_count:
          type: integer
          nullable: true
          description: Capacity limit for this tier (null = unlimited)
        spots_taken:
          type: integer
          nullable: true
          description: Present only when max_count is set
    EventAddon:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: T-shirt
        description:
          type: string
          nullable: true
        price_ore:
          type: integer
          example: 20000
        price_formatted:
          type: string
          example: 200,00 kr
        options:
          type: array
          nullable: true
          items:
            type: string
          example:
          - S
          - M
          - L
          - XL
          description: Available variants (null = no variants)
        max_count:
          type: integer
          nullable: true
        spots_taken:
          type: integer
          nullable: true
        sort_order:
          type: integer
    Event:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
          example: Spelkväll mars
        slug:
          type: string
          example: spelkvall-mars
        brand:
          type: string
          enum:
          - armagedon
          - bsk
          description: Which organization's visual identity the event/scanner UI should use.
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - draft
          - published
          - cancelled
          - completed
        visibility:
          type: string
          enum:
          - public
          - members_only
          - section_only
          - invite_only
        location_type:
          type: string
          nullable: true
          enum:
          - room
          - venue_application
          - external
          - digital
        location_name:
          type: string
          nullable: true
        location_url:
          type: string
          nullable: true
        registration_mode:
          type: string
          enum:
          - standard
          - dropin
          - both
        admission_type:
          type: string
          enum:
          - on_payment
          - automatic
          - manual
          description: 'on_payment — confirmed only after payment;

            automatic — confirmed immediately (even if paid);

            manual — pending_approval until organizer reviews

            '
        waitlist_mode:
          type: string
          enum:
          - none
          - manual
        requires_membership:
          type: boolean
        registration_opens_at:
          type: string
          format: date-time
          nullable: true
        registration_closes_at:
          type: string
          format: date-time
          nullable: true
        registration_instructions:
          type: string
          nullable: true
        is_registration_open:
          type: boolean
        occurrences:
          type: array
          items:
            $ref: '#/components/schemas/EventOccurrence'
        price_tiers:
          type: array
          items:
            $ref: '#/components/schemas/EventPriceTier'
        addons:
          type: array
          items:
            $ref: '#/components/schemas/EventAddon'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EventRegistration:
      type: object
      properties:
        id:
          type: integer
        event_id:
          type: integer
        user_id:
          type: integer
          nullable: true
        guest_name:
          type: string
          nullable: true
        guest_email:
          type: string
          nullable: true
        price_tier_id:
          type: integer
          nullable: true
        status:
          type: string
          enum:
          - pending_payment
          - pending_approval
          - confirmed
          - waitlisted
          - cancelled
          - transferred
        check_in_token:
          type: string
          nullable: true
          description: Only present when viewing your own registration
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        price_tier:
          nullable: true
          $ref: '#/components/schemas/EventPriceTier'
    AdmissionRegistration:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          nullable: true
        price_tier:
          nullable: true
          type: object
          properties:
            id:
              type: integer
            label:
              type: string
            price_ore:
              type: integer
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - pending_payment
          - pending_approval
          - confirmed
          - waitlisted
          - cancelled
          - transferred
        created_at:
          type: string
          format: date-time
    AccountDeletionRequest:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
        reason:
          type: string
          nullable: true
        admin_note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        actioned_at:
          type: string
          format: date-time
          nullable: true
        member:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            full_name:
              type: string
            membership_number:
              type: string
            email:
              type: string
        actioned_by:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
    ProductVariant:
      type: object
      properties:
        id:
          type: integer
          example: 7
        option_value:
          type: string
          example: M
          description: Empty string for products without a variant dimension
        price_adjustment_ore:
          type: integer
          example: 0
          description: Added to the base product price. Negative = discount.
        price_adjustment_formatted:
          type: string
          example: +0,00 kr
        sku:
          type: string
          nullable: true
          example: ARM-TSHIRT-M
        stock:
          type: integer
          nullable: true
          example: 15
          description: null means unlimited (not tracked)
        in_stock:
          type: boolean
          example: true
        sort_order:
          type: integer
          example: 0
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: Armagedon T-shirt
        slug:
          type: string
          example: armagedon-t-shirt
        description:
          type: string
          nullable: true
          example: Klassisk t-shirt i bomull med Armagedon-logo.
        type:
          type: string
          enum:
          - physical
          - digital
          example: physical
        status:
          type: string
          enum:
          - draft
          - published
          - archived
          example: published
        price_ore:
          type: integer
          example: 24900
          description: Base price in öre (SEK cents)
        price_formatted:
          type: string
          example: 249,00 kr
        requires_membership:
          type: boolean
          example: false
        show_in_event_checkout:
          type: boolean
          example: false
        track_stock:
          type: boolean
          example: true
        is_available:
          type: boolean
          example: true
        has_variants:
          type: boolean
          example: true
        dimension_label:
          type: string
          nullable: true
          example: Storlek
        image_url:
