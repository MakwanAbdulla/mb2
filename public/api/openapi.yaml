      description: Returns pending approval list, waitlist, confirmed count, capacity and spots remaining. Requires `events.manage`.
      operationId: adminEventsAdmissionSummary
      parameters:
      - in: path
        name: event
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Admission summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending_approval:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdmissionRegistration'
                  waitlisted:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdmissionRegistration'
                  confirmed_count:
                    type: integer
                  capacity:
                    type: integer
                    nullable: true
                  spots_remaining:
                    type: integer
                    nullable: true
  /admin/events/{event}/admission/approve:
    post:
      tags:
      - AdminEvents
      summary: Approve registrations
      description: Approve one or more pending_approval registrations. Sends confirmation mail per registration. Requires `events.manage`.
      operationId: adminEventsAdmissionApprove
      parameters:
      - in: path
        name: event
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - registration_ids
              properties:
                registration_ids:
                  type: array
                  items:
                    type: integer
                  minItems: 1
      responses:
        '200':
          description: Registrations approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  approved:
                    type: integer
        '422':
          description: No matching pending registrations found
  /admin/events/{event}/admission/reject:
    post:
      tags:
      - AdminEvents
      summary: Reject registrations
      description: Reject one or more pending_approval registrations (sets status to cancelled). Sends mail per registration. Requires `events.manage`.
      operationId: adminEventsAdmissionReject
      parameters:
      - in: path
        name: event
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - registration_ids
              properties:
                registration_ids:
                  type: array
                  items:
                    type: integer
                  minItems: 1
      responses:
        '200':
          description: Registrations rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  rejected:
                    type: integer
        '422':
          description: No matching pending registrations found
  /admin/events/{event}/admission/admit-waitlist:
    post:
      tags:
      - AdminEvents
      summary: Admit from waitlist
      description: Promote the next N waitlisted registrations. New status depends on event admission_type (automatic→confirmed, manual→pending_approval, on_payment→pending_payment or confirmed). Requires `events.manage`.
      operationId: adminEventsAdmissionAdmitWaitlist
      parameters:
      - in: path
        name: event
        required: true
        schema:
          type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                count:
                  type: integer
                  minimum: 1
                  default: 1
                  description: Number of people to admit from the top of the waitlist
      responses:
        '200':
          description: Admitted from waitlist
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  admitted:
                    type: integer
  /admin/events/{event}/admission/walkin:
    post:
      tags:
      - AdminEvents
      summary: Add walk-in registration
      description: Register a member as a confirmed walk-in and mark them as attended on the first occurrence. Requires `events.manage`.
      operationId: adminEventsAdmissionWalkin
      parameters:
      - in: path
        name: event
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - member_id
              properties:
                member_id:
                  type: integer
                  description: ID of the member to register as walk-in
      responses:
        '201':
          description: Walk-in registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  registration:
                    $ref: '#/components/schemas/EventRegistration'
        '422':
          description: Member is already registered for this event
  /admin/events/{event}/occurrences/{occurrence}/check-in:
    post:
      tags:
      - AdminEvents
      summary: Check in a participant for an occurrence
      description: |
        Check in a registered participant for a specific event occurrence.
        Supports two authentication methods:
        - **Method A** (member card QR, rotating HMAC): provide `member_id` + `token` (64-char hex HMAC).
        - **Method B** (static ticket QR): provide `check_in_token` (32-char string from registration).

        Returns `already_checked_in: true` without error if the participant was already checked in.
        Requires `events.manage`.
      operationId: adminEventsCheckIn
      parameters:
      - in: path
        name: event
        required: true
        schema:
          type: integer
      - in: path
        name: occurrence
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                member_id:
                  type: integer
                  description: Member ID (Method A — required when token is provided)
                token:
                  type: string
                  minLength: 64
                  maxLength: 64
                  description: Rotating HMAC token from member card QR (Method A)
                check_in_token:
                  type: string
                  minLength: 32
                  maxLength: 32
                  description: Static ticket token from registration QR (Method B)
      responses:
        '200':
          description: Check-in successful (or already checked in)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      already_checked_in:
                        type: boolean
                      attended_at:
                        type: string
                        format: date-time
                        nullable: true
                      member:
                        type: object
                        nullable: true
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                          avatar_url:
                            type: string
                            nullable: true
                          membership_type:
                            type: string
                          is_active:
                            type: boolean
                      registration:
                        type: object
                        properties:
                          id:
                            type: integer
                          status:
                            type: string
                          price_tier:
                            type: string
                            nullable: true
                          addons:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                selected_option:
                                  type: string
                                  nullable: true
                      occurrence:
                        type: object
                        properties:
                          id:
                            type: integer
                          starts_at:
                            type: string
                            format: date-time
                          location:
                            type: string
                            nullable: true
        '401':
          description: Invalid HMAC token (Method A)
        '404':
          description: Occurrence does not belong to event, or no matching registration found
        '422':
          description: Registration is not in a confirmable status
