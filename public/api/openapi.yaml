  /admin/signing-requests:
    get:
      tags:
      - SigningRequests
      summary: List signing requests
      operationId: adminSigningRequestsIndex
      description: Requires signing.view (all requests) or signing.create (only your own).
      parameters:
      - in: query
        name: status
        schema:
          type: string
          enum: [draft, pending, paused, completed, cancelled, failed]
      - in: query
        name: per_page
        schema:
          type: integer
      responses:
        '200':
          description: Signing requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SigningRequest'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      tags:
      - SigningRequests
      summary: Create and send a signing request
      operationId: adminSigningRequestsStore
      description: >
        Requires signing.create or signing.manage. Files are PDFs as base64. A signer whose e-mail belongs to
        a Membrum user is linked to that user. Returns 201 when sent, or 502 with the request
        (status failed, last_error set) if DocSign refused it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, files, signers]
              properties:
                name:
                  type: string
                comment:
                  type: string
                  nullable: true
                send_reminders:
                  type: boolean
                send_receipt:
                  type: boolean
                files:
                  type: array
                  items:
                    type: object
                    required: [name, content_base64]
                    properties:
                      name:
                        type: string
                      content_base64:
                        type: string
                signers:
                  type: array
                  items:
                    type: object
                    required: [name, sign_method]
                    properties:
                      name:
                        type: string
                      email:
                        type: string
                        nullable: true
                      phone:
                        type: string
                        nullable: true
                      sign_method:
                        type: string
                        enum: [bankid, email]
                      role_label:
                        type: string
                        nullable: true
      responses:
        '201':
          description: Created and sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SigningRequest'
        '502':
          description: Created but DocSign refused to send it
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SigningRequest'
  /admin/signing-requests/{signingRequest}:
    get:
      tags:
      - SigningRequests
      summary: Show a signing request
      operationId: adminSigningRequestsShow
      description: Requires signing.view, or signing.create for your own request.
      parameters:
      - in: path
        name: signingRequest
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Signing request
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SigningRequest'
  /admin/signing-requests/{signingRequest}/pause:
    post:
      tags:
      - SigningRequests
      summary: Pause a pending signing request
      operationId: adminSigningRequestsPause
      description: Requires signing.manage, or signing.create for your own request. Only from status pending.
      parameters:
      - in: path
        name: signingRequest
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Paused
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SigningRequest'
        '409':
          description: The request (or the document at DocSign) does not have status pending
        '502':
          description: DocSign failed
  /admin/signing-requests/{signingRequest}/resume:
    post:
      tags:
      - SigningRequests
      summary: Resume a paused signing request
      operationId: adminSigningRequestsResume
      description: Requires signing.manage, or signing.create for your own request. Only from status paused.
      parameters:
      - in: path
        name: signingRequest
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SigningRequest'
        '409':
          description: The request (or the document at DocSign) does not have status paused
        '502':
          description: DocSign failed
  /admin/signing-requests/{signingRequest}/cancel:
    post:
      tags:
      - SigningRequests
      summary: Cancel a signing request
      operationId: adminSigningRequestsCancel
      description: Requires signing.manage, or signing.create for your own request. Deletes the document at DocSign (pausing it first if pending) so it can no longer be signed. Files and event log are kept. Not for completed requests.
      parameters:
      - in: path
        name: signingRequest
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SigningRequest'
        '409':
          description: The request is completed or already cancelled
        '502':
          description: DocSign failed
