                      imported: {type: integer, description: Number of new transactions imported}
                      skipped: {type: integer, description: Number of duplicate rows skipped}
                      matched_invoices: {type: integer, description: Invoices matched automatically}
                      potential_invoices: {type: integer, description: Possible invoice matches requiring manual confirmation}
