; Matches the upload limits set for the real deployment's zip invoice import
; feature (see public/.htaccess / public/.user.ini) and gives enough headroom
; for local pdftotext-based PDF parsing on a batch of files.
upload_max_filesize = 45M
post_max_size = 50M
memory_limit = 256M
max_execution_time = 120

date.timezone = Europe/Stockholm

; Revalidate on every request so code changes are picked up without a
; container restart — fine for local/trial use, not a production tuning.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
