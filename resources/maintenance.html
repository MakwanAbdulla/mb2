<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tillfälligt underhåll – Membrum</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=instrument-sans:400,600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif;
            background: #231f20;
            color: #fafaf0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .card {
            text-align: center;
            max-width: 480px;
            width: 100%;
        }
        .logo {
            height: 72px;
            width: auto;
            margin: 0 auto 2rem;
            display: block;
        }
        .divider {
            width: 48px;
            height: 3px;
            background: #fddd10;
            border-radius: 2px;
            margin: 1.5rem auto;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #fafaf0;
            letter-spacing: -0.01em;
        }
        p {
            margin-top: 0.75rem;
            font-size: 1rem;
            color: #a8a29e;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.375rem 1rem;
            background: #2e2920;
            color: #fddd10;
            border: 1px solid #5a4f28;
            border-radius: 9999px;
            font-size: 0.8125rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/images/armagedon-logo-light.svg" alt="Armagedon" class="logo">
        <h1>Tillfälligt underhåll</h1>
        <div class="divider"></div>
        <p>Vi uppdaterar sajten och är snart tillbaka.<br>Tack för ditt tålamod!</p>
        <span class="badge">Kommer snart tillbaka!</span>
    </div>
</body>
</html>
