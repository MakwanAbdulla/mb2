services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Armagedon
      APP_ENV: local
      # Demo-only key so the container is reproducible across restarts without
      # a shared .env file. Generate your own with `php artisan key:generate --show`
      # for anything beyond a throwaway trial.
      APP_KEY: base64:nHOx1eMMKvpO7eHF6RLsyRGwLu7I2NQ2QgJAeljxlH0=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_TIMEZONE: Europe/Stockholm
      APP_LOCALE: sv
      APP_FALLBACK_LOCALE: sv
      LOG_CHANNEL: stack
      LOG_LEVEL: debug
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: membrum2
      DB_USERNAME: membrum2
      DB_PASSWORD: secret
      QUEUE_CONNECTION: sync
      CACHE_STORE: database
      SESSION_DRIVER: database
      BROADCAST_CONNECTION: log
      FILESYSTEM_DISK: local
      MAIL_MAILER: log
      # All Google/Discord/Stripe/Swish/Zettle/SumUp/Anthropic/CogWorks keys are
      # intentionally left unset — those integrations self-skip without them
      # (see .env.example). Add them here, or uncomment the .env mount below,
      # to enable one.
    volumes:
      - storage_app:/var/www/html/storage/app
      # Uncomment to load your own .env for the optional-integration keys above
      # (APP_KEY/DB_*/etc. above still win — real env vars always take
      # precedence over the .env file for any key set in `environment:`):
      # - ./.env:/var/www/html/.env:ro
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: membrum2
      MYSQL_USER: membrum2
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  storage_app:
